name: tests
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  nta-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test — pinned NTA kernel boundary
        shell: bash
        run: |
          set +e
          # Run the complete Rust workspace after each kernel change.
          cargo test --manifest-path rust/Cargo.toml -- --nocapture 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload cargo failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-log
          path: cargo-test.log
